<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Admin</title>
<style>
:root {
  --bg: #fbfbfa; --surface: #fff; --surface-2: #f6f6f4;
  --border: #e7e6e2; --border-strong: #d8d6d0;
  --text: #17171a; --text-2: #5c5c66; --text-3: #8a8a94;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
  --success: #12805c; --success-soft: #e7f7f0;
  --warning: #9a6700; --warning-soft: #fdf5e6;
  --danger: #c0362c; --danger-soft: #fdecea;
  --info: #2563eb; --info-soft: #e8f0fe;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-full: 999px;
  --sh-sm: 0 1px 2px rgba(23,23,26,.05), 0 1px 1px rgba(23,23,26,.04);
  --sh-md: 0 4px 12px rgba(23,23,26,.07), 0 2px 4px rgba(23,23,26,.04);
  --sh-drawer: -16px 0 48px rgba(23,23,26,.16);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- icons ---------- */
.ic { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ic-fill { fill: currentColor; stroke: none; }
.ic-lg { width: 20px; height: 20px; }
.ic-xl { width: 26px; height: 26px; }

/* ---------- layout ---------- */
.sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--sh-sm); }
.brand-txt strong { display: block; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand-txt span { display: block; font-size: 11px; color: var(--text-3); }
.nav { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.nav-group { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 16px 10px 6px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-md); color: var(--text-2); font-weight: 500; cursor: pointer; margin-bottom: 1px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item .ic { color: currentColor; }
.nav-item .lbl { flex: 1; }
.nav-badge { font-size: 10.5px; font-weight: 600; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); border-radius: var(--r-full); padding: 1px 7px; }
.nav-item.active .nav-badge { background: #fff; border-color: transparent; }
.nav-badge.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.nav-badge.warning { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
.nav-badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.side-foot { border-top: 1px solid var(--border); padding: 10px 16px; font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }

.topbar { position: fixed; top: 0; left: 240px; right: 0; height: 56px; background: rgba(255,255,255,.85); backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 24px; z-index: 20; }
.cmdk { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text-3); font-size: 13px; cursor: text; }
.cmdk:hover { border-color: var(--border-strong); }
.cmdk .flex1 { flex: 1; text-align: left; }
.kbd { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--text-3); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; box-shadow: var(--sh-sm); }
.top-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.env-ctl { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); font-size: 12px; }
.env-ctl .lbl { color: var(--text-3); }
.env-ctl .val { font-weight: 650; letter-spacing: .03em; }
.env-ctl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.icon-btn { position: relative; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .count { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-full); background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#4338ca); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

.content { margin-left: 240px; padding-top: 56px; min-height: 100vh; }
.view-wrap { max-width: 1280px; margin: 0 auto; padding: 26px 32px 96px; }

/* ---------- typography ---------- */
.display { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
h1 { font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.eyebrow { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.sub { color: var(--text-2); font-size: 13px; }
.sm { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--text-3); }
.txt2 { color: var(--text-2); }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); margin-bottom: 8px; }
.crumbs a { color: var(--text-2); cursor: pointer; }
.crumbs a:hover { color: var(--accent); }
.crumbs .ic { width: 13px; height: 13px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.section-head:first-child { margin-top: 0; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 550; border-radius: var(--r-md); padding: 8px 14px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); box-shadow: var(--sh-sm); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn .ic { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--surface); border-color: var(--border-strong); color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger-soft); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: var(--r-sm); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- inputs ---------- */
input[type=text], input[type=number], input[type=password], select, textarea {
  font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 7px 11px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; min-height: 76px; resize: vertical; }
textarea.locked { background: var(--surface-2); color: var(--text-2); }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 14px 0 5px; }
.field-row { display: flex; gap: 12px; flex-wrap: wrap; }
.field-row > * { flex: 1; min-width: 130px; }
.input-icon { position: relative; }
.input-icon .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.input-icon input { padding-left: 34px; }

/* ---------- toggle (role=switch) ---------- */
.tgl { position: relative; width: 36px; height: 20px; border-radius: var(--r-full); background: var(--border-strong); border: none; cursor: pointer; padding: 0; flex-shrink: 0; transition: background .15s; }
.tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--sh-sm); transition: left .15s; }
.tgl[aria-checked="true"] { background: var(--accent); }
.tgl[aria-checked="true"]::after { left: 18px; }
.tgl:disabled { opacity: .5; cursor: not-allowed; }
.tgl-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.tgl-row:last-child { border-bottom: none; }
.tgl-row .t1 { font-weight: 600; font-size: 13px; }
.tgl-row .t2 { font-size: 12px; color: var(--text-3); margin-top: 1px; }

/* ---------- table ---------- */
.tbl-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: var(--sh-sm); }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); background: var(--surface-2); padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable .ic { width: 12px; height: 12px; opacity: .5; vertical-align: middle; margin-left: 3px; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tbody tr:last-child td, tr:last-child td { border-bottom: none; }
.tbl-row.click { cursor: pointer; }
.tbl-row.click:hover td { background: var(--surface-2); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.tbl-check { width: 34px; }

/* ---------- pills (OUTCOME) & chips (LIFECYCLE / context / tags) ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; border-radius: var(--r-full); padding: 2px 10px; white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.pill-success { background: var(--success-soft); color: var(--success); } .pill-success .dot { background: var(--success); }
.pill-failure { background: var(--warning-soft); color: var(--warning); } .pill-failure .dot { background: var(--warning); }
.pill-error { background: var(--danger-soft); color: var(--danger); } .pill-error .dot { background: var(--danger); }
.pill-healthy { background: var(--success-soft); color: var(--success); } .pill-healthy .dot { background: var(--success); }
.pill-bad { background: var(--danger-soft); color: var(--danger); } .pill-bad .dot { background: var(--danger); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; border-radius: var(--r-full); padding: 2px 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); white-space: nowrap; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.chip-running { color: var(--text); border-color: var(--border-strong); }
.chip-running .dot { background: var(--accent); animation: pulse 1.15s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.65); } }
.ctx-warm { color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, var(--border)); } .ctx-warm .dot { background: var(--info); }
.ctx-cold .dot { background: var(--text-3); }
.ctx-expired { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 34%, var(--border)); } .ctx-expired .dot { background: var(--warning); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: var(--r-sm); padding: 2px 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.tag-accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag-warning { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
.tag-info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.tag-mono { font-family: var(--mono); font-weight: 500; }
.tag-none { color: var(--text-3); background: transparent; border-style: dashed; }

/* ---------- cards ---------- */
.grid { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh-sm); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h2, .card-head h3 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 15px 16px; box-shadow: var(--sh-sm); }
.stat .k { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); font-weight: 550; }
.stat .k .ic { width: 14px; height: 14px; color: var(--text-3); }
.stat .v { font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; }
.stat .d { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.v-ok { color: var(--success); } .v-bad { color: var(--danger); } .v-warn { color: var(--warning); }

/* ---------- attention feed ---------- */
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-bottom: 24px; }
.att { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: var(--r-md); padding: 13px 15px; cursor: pointer; box-shadow: var(--sh-sm); }
.att:hover { border-color: var(--border-strong); box-shadow: var(--sh-md); }
.att.sev-danger { border-left-color: var(--danger); }
.att.sev-warning { border-left-color: var(--warning); }
.att.sev-info { border-left-color: var(--info); }
.att-ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.att.sev-danger .att-ic { background: var(--danger-soft); color: var(--danger); }
.att.sev-warning .att-ic { background: var(--warning-soft); color: var(--warning); }
.att.sev-info .att-ic { background: var(--info-soft); color: var(--info); }
.att-body { flex: 1; min-width: 0; }
.att-body .t1 { font-weight: 600; font-size: 13px; }
.att-body .t2 { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.att-body .t3 { font-size: 11.5px; color: var(--accent); font-weight: 600; margin-top: 7px; display: inline-flex; align-items: center; gap: 4px; }

/* ---------- range chips ---------- */
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.seg button { border: none; background: transparent; padding: 5px 12px; font-size: 12px; font-weight: 550; color: var(--text-2); cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

/* ---------- bar chart ---------- */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-stack { width: 100%; max-width: 42px; display: flex; flex-direction: column-reverse; gap: 2px; }
.bar-stack > div { border-radius: 2px; }
.bar-lbl { font-size: 10.5px; color: var(--text-3); }
.seg-ok { background: color-mix(in srgb, var(--success) 55%, #fff); }
.seg-fail { background: color-mix(in srgb, var(--warning) 62%, #fff); }
.seg-err { background: color-mix(in srgb, var(--danger) 62%, #fff); }
.legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }

/* ---------- running strip ---------- */
.run-strip { display: flex; flex-direction: column; gap: 10px; }
.run-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--r-md); cursor: pointer; }
.run-item:hover { background: var(--surface-2); }
.run-item .prog { grid-column: 1 / -1; height: 5px; background: var(--surface-2); border-radius: var(--r-full); overflow: hidden; }
.run-item .prog > div { height: 100%; background: var(--accent); border-radius: var(--r-full); transition: width .4s; }

/* ---------- meter ---------- */
.meter { height: 7px; background: var(--surface-2); border-radius: var(--r-full); overflow: hidden; margin-top: 6px; }
.meter > div { height: 100%; border-radius: var(--r-full); background: var(--accent); }
.meter.warn > div { background: var(--warning); }
.meter.ok > div { background: var(--success); }

/* ---------- kv ---------- */
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 9px 14px; font-size: 13px; }
.kv .k { color: var(--text-3); }
.kv .v { min-width: 0; }
.kv .v a { color: var(--accent); cursor: pointer; }
.kv .v a:hover { text-decoration: underline; }

/* ---------- note / callout ---------- */
.note { display: flex; gap: 10px; border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-md); padding: 11px 14px; font-size: 12.5px; color: var(--text-2); margin: 14px 0; }
.note .ic { color: var(--text-3); margin-top: 1px; }
.note.accent { border-left: 3px solid var(--accent); }
.note.warning { border-left: 3px solid var(--warning); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .grow { flex: 1; min-width: 200px; }
.toolbar select, .toolbar input { width: auto; }
.toolbar select { min-width: 130px; }

/* ---------- drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; width: 640px; max-width: 96vw; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--sh-drawer); transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1); z-index: 60; display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
.drawer-foot { border-top: 1px solid var(--border); padding: 14px 22px; display: flex; gap: 10px; align-items: center; background: var(--surface); }
.drawer-title { display: flex; align-items: center; gap: 10px; }
.drawer-title h2 { font-size: 16px; }

/* ---------- scrim / modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(23,23,26,.4); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 80; padding: 24px; }
.scrim.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh-md); width: 520px; max-width: 100%; max-height: 88vh; overflow-y: auto; }
.modal-head { padding: 18px 20px 0; }
.modal-head h2 { font-size: 16px; }
.modal-body { padding: 12px 20px; }
.modal-foot { padding: 8px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
.modal-wide { width: 640px; }

/* ---------- toast ---------- */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; background: var(--text); color: #fff; padding: 9px 16px; border-radius: var(--r-full); font-size: 12.5px; font-weight: 550; box-shadow: var(--sh-md); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast .ic { color: color-mix(in srgb, #fff 70%, var(--accent)); }

/* ---------- steps timeline ---------- */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-step { display: flex; gap: 12px; align-items: flex-start; }
.tl-mark { display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tl-line { width: 2px; flex: 1; min-height: 16px; background: var(--border); }
.tl-step.done .tl-dot { border-color: var(--accent); background: var(--accent); color: #fff; }
.tl-step.done .tl-line { background: var(--accent); }
.tl-step.active .tl-dot { border-color: var(--accent); }
.tl-step.active .tl-dot .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.15s ease-in-out infinite; }
.tl-body { padding-bottom: 16px; }
.tl-step:last-child .tl-body { padding-bottom: 0; }
.tl-body .t1 { font-weight: 600; font-size: 13px; }
.tl-step.dim .tl-body .t1 { color: var(--text-3); font-weight: 500; }
.tl-body .t2 { font-size: 11.5px; color: var(--text-3); }

/* ---------- replay ---------- */
.replay { position: relative; border-radius: var(--r-md); background: #1a1a22; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #d4d4dd; cursor: pointer; overflow: hidden; }
.replay::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(79,70,229,.28), transparent 60%); }
.replay .play { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; z-index: 1; }
.replay .cap { font-size: 12px; z-index: 1; }

/* ---------- code / envelope ---------- */
pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 13px; font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre; }
.code-block { position: relative; }
.tabset { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 2px; }
.tabset button { border: none; background: transparent; padding: 5px 12px; font-size: 12.5px; font-weight: 550; color: var(--text-2); border-radius: var(--r-sm); cursor: pointer; }
.tabset button.on { background: var(--surface); color: var(--text); box-shadow: var(--sh-sm); }

/* ---------- diff ---------- */
.diff { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; font-family: var(--mono); font-size: 12px; }
.diff-line { display: flex; gap: 10px; padding: 3px 12px; }
.diff-line .gutter { width: 14px; color: var(--text-3); flex-shrink: 0; }
.diff-line.add { background: var(--success-soft); }
.diff-line.add .gutter { color: var(--success); }
.diff-line.del { background: var(--danger-soft); color: var(--text-3); text-decoration: line-through; }
.diff-line.del .gutter { color: var(--danger); }

/* ---------- sparkline dots ---------- */
.spark { display: inline-flex; gap: 3px; align-items: center; }
.spark i { width: 7px; height: 7px; border-radius: 2px; }
.spark i.ok { background: color-mix(in srgb, var(--success) 60%, #fff); }
.spark i.fail { background: color-mix(in srgb, var(--warning) 65%, #fff); }
.spark i.err { background: color-mix(in srgb, var(--danger) 65%, #fff); }

/* ---------- empty ---------- */
.empty { text-align: center; padding: 54px 20px; color: var(--text-3); }
.empty .ic { width: 34px; height: 34px; color: var(--border-strong); margin-bottom: 12px; }
.empty .t1 { font-weight: 600; color: var(--text-2); font-size: 14px; }
.empty .t2 { font-size: 12.5px; margin-top: 4px; }

/* ---------- bulk bar ---------- */
.bulk-bar { display: none; align-items: center; gap: 12px; background: var(--text); color: #fff; padding: 9px 14px; border-radius: var(--r-md); margin-bottom: 12px; box-shadow: var(--sh-md); }
.bulk-bar.show { display: flex; }
.bulk-bar .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.2); color: #fff; box-shadow: none; }
.bulk-bar .btn:hover { background: rgba(255,255,255,.24); }

/* ---------- docs arch map ---------- */
.arch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px 0; }
.arch-box { border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 12px 14px; background: var(--surface); text-align: center; min-width: 110px; box-shadow: var(--sh-sm); }
.arch-box .t1 { font-weight: 650; font-size: 12.5px; }
.arch-box .t2 { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.arch-box.gw { border-color: var(--accent); background: var(--accent-soft); }
.arch-stack { display: flex; flex-direction: column; gap: 8px; }
.arch-arrow { color: var(--text-3); display: flex; align-items: center; }
.arch-inner { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.arch-inner .tag { background: #fff; }

/* ---------- lifecycle stepper (docs) ---------- */
.stepper { display: flex; flex-direction: column; gap: 2px; }
.step-btn { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; }
.step-btn:hover { background: var(--surface-2); }
.step-btn.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-2); font-size: 12px; font-weight: 650; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-btn.on .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step-btn .st1 { font-weight: 600; font-size: 13px; }
.step-btn .st2 { font-size: 12px; color: var(--text-3); }

.divider { height: 1px; background: var(--border); margin: 24px 0; }
.hstack { display: flex; align-items: center; gap: 10px; }
.vstack { display: flex; flex-direction: column; }
.wrap-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.spacer { flex: 1; }
</style>

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const view = () => $("#view");
function icon(n, cls) { return '<svg class="ic ' + (cls || "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
function plat(k) { return state.platforms.find(p => p.key === k); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nowTime() { return new Date().toTimeString().slice(0,8); }
function nowStamp() { return "2026-07-11 " + new Date().toTimeString().slice(0,5); }

function runningJobs() { return state.jobs.filter(j => j.state === "RUNNING"); }
function failingCreds() { return state.platforms.flatMap(p => p.clients.filter(c => !c.credOk).map(c => ({ p: p.key, vault: p.vault, c }))); }
function redCanaries() { return state.canaries.filter(c => c.last === "failure" || c.last === "error"); }
function driftCanaries() { return state.canaries.filter(c => c.drift); }
function jobsForClient(pk, ck) { return state.jobs.filter(j => j.uc.split(".")[0] === pk && j.client === ck); }

function pill(kind, label) { return '<span class="pill pill-' + kind + '"><span class="dot"></span>' + esc(label) + '</span>'; }
function outcomePill(status, errCode) {
  if (!status) return '<span class="muted">-</span>';
  const label = errCode || status;
  return '<span class="pill pill-' + status + '"><span class="dot"></span>' + esc(label) + '</span>';
}
function lifecycleChip(stateVal) {
  const map = { RUNNING: "chip-running", QUEUED: "chip-queued", DONE: "chip-done" };
  const label = { RUNNING: "running", QUEUED: "queued", DONE: "done" }[stateVal] || stateVal.toLowerCase();
  return '<span class="chip ' + (map[stateVal] || "") + '"><span class="dot"></span>' + label + '</span>';
}
function ctxChip(ctx) { return '<span class="chip ctx-' + ctx + '"><span class="dot"></span>' + ctx + '</span>'; }
function riskChip(risk) {
  return risk === "read-only"
    ? '<span class="tag">read-only</span>'
    : '<span class="tag tag-warning">' + esc(risk) + '</span>';
}

function toast(msg, ok) {
  const wrap = $("#toast-wrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = icon(ok === false ? "alert" : "check") + "<span>" + esc(msg) + "</span>";
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 250); }, 2800);
}

function attentionFeed() {
  const cards = [];
  failingCreds().forEach(fc => {
    cards.push({ sev: "danger", ic: "key",
      t1: fc.p + " / " + fc.c.key + " login is failing",
      t2: "Returns " + fc.c.lastErr + ". Every job for this pair errors until the credential is fixed in 1Password.",
      cta: "Fix credential", href: "#/secrets" });
  });
  redCanaries().forEach(cn => {
    cards.push({ sev: "danger", ic: "canary",
      t1: cn.p + " / " + cn.c + " canary is red",
      t2: "Last scheduled run returned " + cn.last + " (" + cn.ago + "). Independent of credential health.",
      cta: "Open canaries", href: "#/canaries" });
  });
  const hot = state.platforms.flatMap(p => p.actions.filter(a => a.runs > 0 && a.success < 45).map(a => ({ p, a })));
  hot.forEach(h => {
    cards.push({ sev: "warning", ic: "activity",
      t1: h.p.key + "." + h.a.key + " has a high error rate",
      t2: "Success " + h.a.success + "% over " + h.a.runs + " runs (7d). Investigate the portal or the goal.",
      cta: "View jobs", href: "#/jobs?platform=" + h.p.key });
  });
  const stuck = state.jobs.find(j => j.state === "RUNNING" && j.stuck);
  if (stuck) cards.push({ sev: "warning", ic: "clock",
    t1: "Job " + stuck.id + " may be stuck",
    t2: stuck.uc + " for " + stuck.client + " has been running " + stuck.dur + ", close to the 180s timeout.",
    cta: "Open job", href: "#/jobs", job: stuck.id });
  const oldV = state.vaults.find(v => v.tokenAge > 90);
  if (oldV) cards.push({ sev: "warning", ic: "shield",
    t1: "Service account token for " + oldV.name + " is aging",
    t2: "Token is " + oldV.tokenAge + " days old. Rotate before it is disabled by policy.",
    cta: "Rotate token", href: "#/secrets?tab=vaults" });
  return cards;
}

/* ---------------- JOB DRAWER ---------------- */
function envelopeFor(j) {
  const pk = j.uc.split(".")[0];
  const p = plat(pk);
  return {
    status: j.status || "(pending)",
    data: j.data,
    error: j.err,
    meta: {
      jobId: j.id,
      useCase: j.uc,
      client: j.client,
      sessionId: "bb_sess_" + j.id.slice(2),
      sessionReplayUrl: "https://browserbase.com/sessions/bb_sess_" + j.id.slice(2),
      credentialItem: "op://" + (p ? p.vault : "Portals") + "/" + pk + "." + j.client,
      ranAt: "2026-07-11T" + j.at + "Z",
      durationMs: j.dur ? parseInt(j.dur) * 1000 : null,
      attempts: j.status === "error" ? 2 : 1
    }
  };
}
function stepTimeline(j) {
  const steps = [
    ["submit", "Request accepted, envelope opened"],
    ["resolve", "Resolved " + j.uc + " to an action definition"],
    ["validate", "Validated input against the zod schema"],
    ["merge override", "Merged client override for " + j.client],
    ["credentials", "Read op:// credential item just in time"],
    ["launch", "Launched Browserbase session"],
    ["login", "Logged into the portal"],
    ["execute", "Ran the goal against the verified record"],
    ["deliver", "Validated output, sealed the envelope"]
  ];
  let activeIdx = 7;
  if (j.state === "QUEUED") activeIdx = 0;
  return '<div class="timeline">' + steps.map((s, i) => {
    let cls = "dim";
    if (j.state === "DONE") cls = "done";
    else if (i < activeIdx) cls = "done";
    else if (i === activeIdx) cls = "active";
    const mark = cls === "done" ? icon("check") : cls === "active" ? '<span class="pulse"></span>' : "";
    return '<div class="tl-step ' + cls + '"><div class="tl-mark"><div class="tl-dot">' + mark + '</div>' +
      (i < steps.length - 1 ? '<div class="tl-line"></div>' : "") + '</div>' +
      '<div class="tl-body"><div class="t1">' + s[0] + '</div><div class="t2">' + esc(s[1]) + '</div></div></div>';
  }).join("") + '</div>';
}
function showJob(id) {
  const j = state.jobs.find(x => x.id === id);
  if (!j) return;
  const pk = j.uc.split(".")[0];
  const ak = j.uc.split(".")[1];
  const p = plat(pk);
  const env = envelopeFor(j);
  state.ui.envelopeMode = "pretty";
  const raw = JSON.stringify(env, null, 2);
  const pretty =
    '<div class="kv" style="grid-template-columns:120px 1fr">' +
    '<span class="k">Status</span><span class="v">' + outcomePill(j.status, j.err && j.err.code) + '</span>' +
    (j.data ? '<span class="k">data</span><span class="v mono xs">' + esc(JSON.stringify(j.data)) + '</span>' : '') +
    (j.err ? '<span class="k">error.code</span><span class="v"><span class="tag tag-warning">' + j.err.code + '</span></span>' +
             '<span class="k">error.message</span><span class="v sm">' + esc(j.err.message) + '</span>' : '') +
    '<span class="k">durationMs</span><span class="v mono xs">' + env.meta.durationMs + '</span>' +
    '<span class="k">attempts</span><span class="v mono xs">' + env.meta.attempts + '</span>' +
    '</div>';

  const head = '<div class="drawer-title">' + icon("jobs", "ic-lg") +
    '<div><h2>Job ' + j.id + '</h2><div class="xs muted mono">' + j.uc + '</div></div></div>';

  const body =
    '<div class="kv">' +
    '<span class="k">Use case</span><span class="v"><a onclick="closeDrawer();openActionEditor(\'' + pk + '\',\'' + ak + '\')">' + j.uc + '</a></span>' +
    '<span class="k">Client</span><span class="v"><a onclick="closeDrawer();go(\'#/catalogue/' + pk + '?tab=clients\')"><span class="tag tag-mono">' + j.client + '</span></a></span>' +
    '<span class="k">Credential</span><span class="v"><a class="mono" onclick="closeDrawer();go(\'#/secrets\')">' + env.meta.credentialItem + '</a></span>' +
    '<span class="k">Caller</span><span class="v"><a onclick="closeDrawer();go(\'#/access\')">' + j.caller + '</a></span>' +
    '<span class="k">State</span><span class="v">' + lifecycleChip(j.state) + '</span>' +
    '<span class="k">Outcome</span><span class="v">' + outcomePill(j.status, j.err && j.err.code) + '</span>' +
    '<span class="k">Started</span><span class="v sm txt2">' + j.at + (j.dur ? ' · ' + j.dur : '') + '</span>' +
    '</div>' +

    (j.state !== "DONE" ?
      '<div class="section-head"><h2>Progress</h2></div>' + stepTimeline(j) : '') +

    '<div class="section-head"><h2>Session replay</h2></div>' +
    '<div class="replay" onclick="toast(\'Would open the Browserbase session replay\')">' +
    '<div class="play">' + icon("play", "ic-lg ic-fill") + '</div>' +
    '<div class="cap">Open session replay · ' + env.meta.sessionId + '</div></div>' +

    '<div class="section-head"><h2>Envelope</h2>' +
    '<div class="hstack"><span class="tabset" id="env-tabs">' +
    '<button class="on" onclick="setEnvMode(\'pretty\',\'' + j.id + '\')">Pretty</button>' +
    '<button onclick="setEnvMode(\'raw\',\'' + j.id + '\')">Raw</button></span>' +
    '<button class="btn btn-sm btn-ghost" id="copy-env">' + icon("copy") + 'Copy</button></div></div>' +
    '<div id="env-block">' + pretty + '</div>';

  const foot =
    (j.state === "RUNNING" ? '<button class="btn btn-danger" onclick="cancelJob(\'' + j.id + '\')">' + icon("close") + 'Cancel run</button>' : '') +
    (j.state === "DONE" && j.status !== "success" ? '<button class="btn btn-primary" onclick="retryJob(\'' + j.id + '\')">' + icon("refresh") + 'Retry job</button>' : '') +
    '<span class="spacer"></span><button class="btn btn-ghost" onclick="closeDrawer()">Close</button>';

  openDrawer(head, body, foot);
  $("#drawer")._env = { pretty, raw };
  $("#copy-env").onclick = () => copyText(raw, "Envelope");
}
function setEnvMode(mode, id) {
  const d = $("#drawer");
  $$("#env-tabs button").forEach((b, i) => b.classList.toggle("on", (mode === "pretty") === (i === 0)));
  $("#env-block").innerHTML = mode === "pretty" ? d._env.pretty : '<pre>' + esc(d._env.raw) + '</pre>';
}
function doRetry(id, silent) {
  const j = state.jobs.find(x => x.id === id);
  if (!j) return;
  const nid = "j_" + Math.random().toString(16).slice(2, 7);
  state.jobs.unshift({ id: nid, uc: j.uc, client: j.client, caller: "admin (manual retry)", state: "QUEUED", status: null, dur: null, at: nowTime(), data: null, err: null });
  if (!silent) audit("Manually retried job " + id + " as " + nid);
  return nid;
}
function retryJob(id) {
  const nid = doRetry(id);
  renderNav();
  if (currentTop() === "jobs") renderJobsTable();
  closeDrawer();
  toast("Retry queued as " + nid);
}
function cancelJob(id) {
  confirmModal("Cancel running job?", "<strong>" + id + "</strong> will be stopped and its envelope sealed with error code CANCELLED.", "Cancel run", () => {
    const j = state.jobs.find(x => x.id === id);
    j.state = "DONE"; j.status = "error"; j.err = { code: "CANCELLED", message: "Cancelled by admin" }; j.stuck = false;
    audit("Cancelled job " + id);
    renderNav();
    if (currentTop() === "jobs") renderJobsTable();
    closeDrawer();
    toast("Job cancelled");
  }, true);
}

  const dot = n => '<span style="width:7px;height:7px;border-radius:50%;background:' + (n <= step ? "var(--accent)" : "var(--border-strong)") + '"></span>';
  const steps = '<div class="hstack" style="gap:6px;margin-bottom:4px">' + dot(1) + dot(2) + dot(3) + '<span class="xs muted" style="margin-left:6px">Step ' + step + ' of 3</span></div>';
  let bodyInner = "";
  if (step === 1) {
    bodyInner =
      '<label class="f">Platform display name</label><input type="text" id="w-name" value="' + esc(draft.name) + '" placeholder="LightReach / Palmetto">' +
      '<label class="f">Platform key (used in useCase)</label><input type="text" id="w-key" value="' + esc(draft.key) + '" placeholder="lightreach">' +
      '<label class="f">Base URL</label><input type="text" id="w-url" value="' + esc(draft.url) + '" placeholder="https://palmetto.finance/accounts">' +
      '<label class="f">Vault</label><select id="w-vault">' + state.vaults.map(v => '<option' + (draft.vault === v.name ? " selected" : "") + '>' + v.name + '</option>').join("") + '</select>';
  } else if (step === 2) {
    bodyInner =
      '<label class="f">First client key</label><input type="text" id="w-client" value="' + esc(draft.client) + '" placeholder="default">' +
      '<label class="f">1Password item preview</label>' +
      '<div class="mono" id="w-prev" style="padding:8px 11px;background:var(--surface-2);border-radius:var(--r-md)">op://' + draft.vault + '/' + (draft.key || "platform") + '.&lt;client&gt;</div>' +
      '<div class="note accent">' + icon("info") + '<div>Add the login to this item in 1Password. The gateway reads it just in time on the first run.</div></div>';
  } else {
    bodyInner =
      '<label class="f">First action key</label><input type="text" id="w-action" value="' + esc(draft.action) + '" placeholder="milestoneStatus">' +
      '<div class="note warning">' + icon("alert") + '<div>First-live-run rule: a new action starts as a draft. It stays draft until one real job for ' + (draft.key || "the platform") + ' succeeds end to end, which locks the extract schema shape callers will depend on.</div></div>';
  }
  openModal(
    '<div class="modal-head">' + steps + '<h2>New platform</h2></div>' +
    '<div class="modal-body">' + bodyInner + '</div>' +
    '<div class="modal-foot">' +
    (step > 1 ? '<button class="btn" onclick="wizBack(' + step + ')">Back</button>' : '<button class="btn" onclick="closeModal()">Cancel</button>') +
    '<span class="spacer"></span>' +
    (step < 3 ? '<button class="btn btn-primary" onclick="wizNext(' + step + ')">Continue</button>'
              : '<button class="btn btn-primary" onclick="wizFinish()">Create platform</button>') +
    '</div>');
  window._wizDraft = draft;
  if (step === 2) { const c = $("#w-client"); c.addEventListener("input", () => { $("#w-prev").textContent = "op://" + draft.vault + "/" + draft.key + "." + (c.value || "<client>"); }); }
}
function wizCollect(step) {
  const d = window._wizDraft;
  if (step === 1) { d.name = $("#w-name").value.trim(); d.key = $("#w-key").value.trim(); d.url = $("#w-url").value.trim(); d.vault = $("#w-vault").value; }
  if (step === 2) { d.client = $("#w-client").value.trim(); }
  if (step === 3) { d.action = $("#w-action").value.trim(); }
  return d;
}
function wizNext(step) {
  const d = wizCollect(step);
  if (step === 1 && (!d.name || !d.key)) { toast("Name and key are required", false); return; }
  if (step === 2 && !d.client) { toast("A first client is required", false); return; }
  newPlatformWizard(step + 1, d);
}
function wizBack(step) { const d = wizCollect(step); newPlatformWizard(step - 1, d); }
function wizFinish() {
  const d = wizCollect(3);
  if (!d.action) { toast("A first action is required", false); return; }
  plat(d.key) || state.platforms.push({
    key: d.key, name: d.name, vault: d.vault, url: d.url,
    actions: [{ key: d.action, risk: "read-only", enabled: false, status: "draft", variants: [], timeout: 180, attempts: 2, input: "", extract: "", goal: "", runs: 0, success: 0 }],
    clients: [{ key: d.client, enabled: true, credOk: true, lastRead: "never", ctx: "cold", ctxAge: null, overrides: {} }]
  });
  audit("Created platform " + d.key + " with client " + d.client + " and draft action " + d.action);
  closeModal(); renderNav(); go("#/catalogue/" + d.key); toast("Platform " + d.key + " created");
}

function saveAction(pk, ak) {
  const p = plat(pk);
  const isNew = ak === null;
  const existing = isNew ? null : p.actions.find(x => x.key === ak);
  const key = $("#a-key").value.trim();
  if (!key) { toast("Action key is required", false); return; }
  const obj = {
    key: key,
    variants: $("#a-var").value.split(",").map(s => s.trim()).filter(Boolean),
    input: $("#a-in").value, goal: $("#a-goal").value, extract: $("#a-ex").value,
    timeout: +$("#a-to").value || 180, attempts: +$("#a-at").value || 2,
    risk: $("#a-risk").value.startsWith("read") ? "read-only" : "form-submit",

    runs: existing ? existing.runs : 0, success: existing ? existing.success : 0
  };
  if (existing) { Object.assign(existing, obj); } else { p.actions.push(obj); }

  closeDrawer(); renderPlatformDetail(pk, "actions"); toast("Action saved" + (isNew ? " as draft" : ""));
}
function deleteAction(pk, ak) {

}

function openOverrideEditor(pk, ck, ak) {

    '<label class="f">Timeout override (blank = base ' + a.timeout + 's)</label><input type="number" id="o-to" value="' + (o.timeout || "") + '" oninput="renderDiff(\'' + pk + '\',\'' + ck + '\',\'' + ak + '\')">' +

  const foot = '<button class="btn btn-primary" onclick="saveOverride(\'' + pk + '\',\'' + ck + '\',\'' + ak + '\')">Save override</button>' +

    (c.overrides[ak] ? '<button class="btn btn-danger" onclick="removeOverride(\'' + pk + '\',\'' + ck + '\',\'' + ak + '\')">Remove</button>' : '');
  openDrawer(head, body, foot);
  renderDiff(pk, ck, ak);
}
function renderDiff(pk, ck, ak) {
  const p = plat(pk);
  const a = p.actions.find(x => x.key === ak) || { goal: "", timeout: 180, url: p.url };
  const url = ($("#o-url") && $("#o-url").value) || "";
  const labels = ($("#o-labels") && $("#o-labels").value) || "";
  const hints = ($("#o-hints") && $("#o-hints").value) || "";
  const to = ($("#o-to") && $("#o-to").value) || "";
  const base = [
    { label: "startUrl", v: p.url },
    { label: "goal", v: a.goal },
    { label: "labelMap", v: "(none)" },
    { label: "timeout", v: a.timeout + "s" }
  ];
  const merged = [
    { label: "startUrl", v: url || p.url, changed: !!url },
    { label: "goal", v: a.goal + (hints ? " " + hints : ""), changed: !!hints },
    { label: "labelMap", v: labels ? labels.split("\n").filter(Boolean).length + " mapping(s)" : "(none)", changed: !!labels },
    { label: "timeout", v: (to || a.timeout) + "s", changed: !!to }
  ];
  let html = '<div class="diff">';
  merged.forEach((m, i) => {
    if (m.changed) {
      html += '<div class="diff-line del"><span class="gutter">-</span><span>' + esc(base[i].label + ": " + base[i].v) + '</span></div>';
      html += '<div class="diff-line add"><span class="gutter">+</span><span>' + esc(m.label + ": " + m.v) + '</span></div>';
    } else {
      html += '<div class="diff-line"><span class="gutter"> </span><span>' + esc(m.label + ": " + m.v) + '</span></div>';
    }
  });
  html += '</div>';
  const block = $("#diff-block");
  if (block) block.innerHTML = html;
}
function saveOverride(pk, ck, ak) {
  const c = plat(pk).clients.find(x => x.key === ck);
  const o = { url: $("#o-url").value.trim(), labels: $("#o-labels").value, hints: $("#o-hints").value.trim(), timeout: $("#o-to").value ? +$("#o-to").value : null };
  if (!o.url && !o.labels.trim() && !o.hints && !o.timeout) { toast("Nothing to save; override is empty", false); return; }
  c.overrides[ak] = o;
  audit("Saved override on " + pk + "." + ak + " for client " + ck);
  closeDrawer(); renderPlatformDetail(pk, "clients"); toast("Override saved for " + ck);
}
function removeOverride(pk, ck, ak) {
  confirmModal("Remove override?", "<strong>" + ck + "</strong> goes back to the base definition of " + ak + ".", "Remove", () => {
    delete plat(pk).clients.find(x => x.key === ck).overrides[ak];
    audit("Removed override on " + pk + "." + ak + " for " + ck);
    closeDrawer(); renderPlatformDetail(pk, "clients"); toast("Override removed");
  }, true);
}

function runCanary(i) {
  const c = state.canaries[i];
  toast("Running canary " + c.p + " / " + c.c + " ...");
  setTimeout(() => {
    const cl = plat(c.p) && plat(c.p).clients.find(x => x.key === c.c);
    if (cl && !cl.credOk) { c.last = "error"; c.ago = "just now"; c.hist = c.hist.slice(1).concat("err"); }
    else { c.last = "success"; c.ago = "just now"; c.drift = false; c.hist = c.hist.slice(1).concat("ok"); }
    audit("Ran canary now for " + c.p + " / " + c.c);
    renderNav(); renderCanaries();
    toast("Canary " + c.p + "/" + c.c + ": " + c.last);
  }, 1000);
}
function runAllCanaries() {
  toast("Queued a run for every canary");
  setTimeout(() => {
    state.canaries.forEach(c => {
      const cl = plat(c.p) && plat(c.p).clients.find(x => x.key === c.c);
      if (cl && !cl.credOk) { c.last = "error"; c.ago = "just now"; c.hist = c.hist.slice(1).concat("err"); }
      else { c.last = "success"; c.ago = "just now"; c.drift = false; c.hist = c.hist.slice(1).concat("ok"); }
    });
    audit("Ran all canaries");
    renderNav(); renderCanaries(); toast("All canaries finished");
  }, 1200);
}

    '<div><div class="xs muted" style="margin-bottom:6px">LIFECYCLE (job state, outlined chip)</div><div class="wrap-chips">' +
    lifecycleChip("QUEUED") + lifecycleChip("RUNNING") + lifecycleChip("DONE") + '</div></div>' +
    '<div><div class="xs muted" style="margin-bottom:6px">CONTEXT (warm login, never green)</div><div class="wrap-chips">' +
    ctxChip("warm") + ctxChip("cold") + ctxChip("expired") + '</div></div>' +
    '</div></div>' +
    '<div class="card"><div class="card-head"><h3>Error-code taxonomy</h3></div>' +
    '<div class="tbl-scroll"><table><thead><tr><th>Code</th><th>Stage</th><th>Family</th></tr></thead><tbody>' +
    state.errorCodes.map(e => '<tr><td class="mono xs">' + e.code + '</td><td class="sm txt2">' + e.stage + '</td><td>' +
      (e.family === "error" ? '<span class="tag" style="color:var(--danger)">error</span>' : '<span class="tag" style="color:var(--warning)">failure</span>') + '</td></tr>').join("") +
    '</tbody></table></div></div></div></div>';
}
function setStep(i) { state.ui.stepIdx = i; renderDocs(); }
/* re-render audit rows helper alias used after live appends */
function renderAuditRows() { drawAuditRows(); }

/* ============================================================
   BOOT
   ============================================================ */
renderNav();
router();
</script>
</body>
</html>
